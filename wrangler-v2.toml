# Legacy duplicate of wrangler.toml. Wrangler uses wrangler.toml by default.
# Keep in sync; do not add [build].command here (it re-enters build:cf).
name = "kedi-web"
main = ".open-next/worker.js"
compatibility_date = "2026-09-14"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
NEXTJS_ENV = "production"

[observability]
enabled = true

[images]
binding = "IMAGES"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "kedi-web"
