name = "kedi-web"
workers_dev = true
account_id = "a220275c9c8460745e0351255c7459fd"
routes = [
  { pattern = "kedi.media", custom_domain = true },
  { pattern = "www.kedi.media", custom_domain = true }
]
main = ".open-next/worker.js"
# next-themes serializes a function into browser JavaScript. Retaining names
# inserts a Worker-only __name helper into that serialized function.
keep_names = false
compatibility_date = "2026-09-14"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"
run_worker_first = ["/blog-clone", "/blog-clone/*"]

[vars]
NEXTJS_ENV = "production"

[observability]
enabled = true

# Self-reference required by OpenNext caching / revalidation.
# Service name must match the Worker name.
[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "kedi-web"
